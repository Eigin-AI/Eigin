[package]
name = "eigin-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
convert_case = "0.6"
minijinja = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.44"
toml = "0.8"
walkdir = "2"
glob = "0.3"
dirs = "5"
# Grant signing faucet
jsonwebtoken = "9"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
