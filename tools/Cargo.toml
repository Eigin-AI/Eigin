[package]
name = "eigin-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
convert_case = "0.6"
minijinja = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.44"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
