# Model-asset mirror pointer: which asset versions the relay serves as current.
#
# One [[assets]] entry per mirrored asset. Bumping `version` (+ the new
# `manifest_sha256`) is the review-gated swap: apps keep referencing the same
# asset id. Entries are minted by `eigin-tools assets upload`, which prints the
# ready-to-paste block.
#
# This one file is baked into both staging and production images, so a version
# must exist in both buckets under the same id. The runbook promotes by
# re-uploading the same bytes to production with `--version <same id>`.
#
# Dev with no bucket configured: this file stays empty and the module is inert
# (GET /v1/assets lists nothing, GET /v1/assets/{id} 404s).
[[assets]]
id = "gemma4-e2b-litertlm"
version = "2026-09-01-2111"
manifest_sha256 = "2580c981e3a75d1b45142b1a46a99a54d4a9bf4980e5fceee99b19409606a916"

