[package]
name = "eigin-relay"
version = "1.0.0"
edition = "2024"
# The relay server is the default binary; `rotate-key` (src/bin/) is an admin tool run
# explicitly. Both are auto-discovered; only the default needs naming.
default-run = "eigin-relay"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
time = { version = "0.3", features = ["formatting", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
async-trait = "0.1"
futures = "0.3"
bytes = "1"
http = "1"
# Credit ledger
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "migrate", "macros"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chacha20poly1305 = "0.10"
thiserror = "1"
app-store-server-library = "4.3.0"
tokio-stream = "0.1"
jsonwebtoken = "9"
clap = { version = "4", features = ["derive"] }
# S3-compatible object storage (Scaleway) backing the model-asset mirror.
object_store = { version = "0.14", features = ["aws"] }
url = "2.5.8"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
http-body = "0.4"
futures-util = "0.3"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }

# Temporary bounded-return fix for #348; provenance and removal in vendor/sqlx-core/PATCH.md.
[patch.crates-io]
sqlx-core = { path = "vendor/sqlx-core" }
