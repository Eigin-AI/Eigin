<!doctype html>
<html lang="%lang%" data-color-scheme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      // Select the root locale before loading styles or the application bundle.
      if (window.location.pathname === "/") {
        const languages = navigator.languages?.length ? navigator.languages : [navigator.language];
        const locale =
          languages
            .map((language) => language.toLowerCase().split("-")[0])
            .find((language) => language === "en" || language === "da") ?? "en";
        window.location.replace(`/${locale}/${window.location.search}${window.location.hash}`);
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
