<!doctype html>
<html lang="%lang%" data-color-scheme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    %sveltekit.head%
    <script>
      // Language-free entry pages choose a locale before the application hydrates.
      const localePath = document.querySelector('meta[name="eigin:locale-path"]')?.content;
      if (localePath !== undefined) {
        const languages = navigator.languages?.length ? navigator.languages : [navigator.language];
        const locale =
          languages
            .map((language) => language.toLowerCase().split("-")[0])
            .find((language) => language === "en" || language === "da") ?? "en";
        window.location.replace(
          `/${locale}/${localePath}${window.location.search}${window.location.hash}`,
        );
      }
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
