<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Context binding test</title>
  </head>
  <body>
    <script type="module">
      import { initialize } from "../src/index.ts";
      import {
        estimateText,
        truncateForBudget,
        parseSummary,
        SummaryParseResult,
      } from "../src/generated/index.ts";
      window.checkContext = async () => {
        await initialize();
        const text = "👨‍👩‍👧‍👦".repeat(400);
        const message = {
          role: "user",
          content: text,
          name: undefined,
          toolCalls: [],
          additionalInputTokens: 0n,
          hasReasoningHistory: false,
        };
        const partial = truncateForBudget([message], 30n);
        const empty = truncateForBudget([message], -1n);
        const summary = parseSummary(
          "<conversation_summary>\u200b" + "e\u0301".repeat(50) + "\u200b",
        );
        return (
          estimateText(text) === 100n &&
          partial.startIndex === 0n &&
          partial.partialContent === "…" + "👨‍👩‍👧‍👦".repeat(103) &&
          empty.startIndex === 1n &&
          empty.partialContent === undefined &&
          SummaryParseResult.Accepted.instanceOf(summary) &&
          summary.inner.summary === "e\u0301".repeat(50)
        );
      };
    </script>
  </body>
</html>
