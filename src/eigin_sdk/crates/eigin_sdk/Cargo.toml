[package]
name = "eigin_sdk"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[features]
# Test-only binding fixture; never enable in application builds.
binding-tests = []

[dependencies]
uniffi.workspace = true
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uniffi-runtime-wasm = "=0.31.0-6"
uniffi_core = { version = "=0.31.0", features = ["wasm-unstable-single-threaded"] }

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }
