[package]
name = "eigin_sdk"
version = "0.1.0"
license-file = "../../../../LICENSE"
edition = "2024"
publish = false

[lib]
crate-type = ["lib", "cdylib"]

[features]
# Test-only binding fixture; never enable in application builds.
binding-tests = []

[dependencies]
uniffi.workspace = true
thiserror = "2"
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uniffi-runtime-wasm = "=0.31.0-6"
uniffi_core = { version = "=0.31.0", features = ["wasm-unstable-single-threaded"] }

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }
