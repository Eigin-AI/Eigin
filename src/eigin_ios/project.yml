name: Eigin-iOS
options:
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16"

packages:
  Textual:
    url: https://github.com/42futures/textual
    branch: main
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    exactVersion: "0.11.0"
  FluidAudio:
    url: https://github.com/42futures/FluidAudio.git
    branch: feature/pocket-tts-sessions
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"
  Factory:
    url: https://github.com/hmlongco/Factory
    from: "2.4.0"

schemes:
  Eigin:
    build:
      targets:
        Eigin: all
        EiginTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EiginTests

  EiginDev:
    build:
      targets:
        EiginDev: all
        EiginTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EiginTests

targets:
  Eigin:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: Textual
      - package: MCP
      - package: FluidAudio
      - package: swift-transformers
        product: Tokenizers
      - package: Factory
      - framework: Frameworks/FirmFFI.xcframework
        embed: false
    info:
      path: Sources/Info.plist
      properties:
        UIBackgroundModes:
          - audio
          - voip
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).backgroundprompt
        EiginRelayURL: $(EIGIN_RELAY_URL)
        EiginRelayKey: $(EIGIN_RELAY_KEY)
        EiginSupportEmail: $(EIGIN_SUPPORT_EMAIL)
        NSUserActivityTypes:
          - INSendMessageIntent
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "0.13.0"
        CURRENT_PROJECT_VERSION: "12"
        INFOPLIST_KEY_CFBundleDisplayName: Eigin
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Eigin uses the microphone to transcribe your voice into text messages."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Eigin uses on-device speech recognition to convert your voice into text."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Eigin uses your location to provide context-aware responses."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Eigin accesses your calendar to check your schedule and create events for you."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Eigin accesses your reminders to check and create reminders for you."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Eigin reads your health data to provide insights into your nutrition and activity."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Eigin saves nutritional data to Apple Health when you log meals."
        EIGIN_RELAY_URL: ${EIGIN_RELAY_URL_PRODUCTION}
        EIGIN_RELAY_KEY: ${EIGIN_RELAY_KEY_PRODUCTION}
        EIGIN_SUPPORT_EMAIL: ${EIGIN_SUPPORT_EMAIL}
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Eigin-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Sources/Eigin.entitlements

  EiginTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    dependencies:
      - target: Eigin
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.tests

  EiginDev:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: Textual
      - package: MCP
      - package: FluidAudio
      - package: swift-transformers
        product: Tokenizers
      - package: Factory
      - framework: Frameworks/FirmFFI.xcframework
        embed: false
    info:
      path: Sources/Info.plist
      properties:
        UIBackgroundModes:
          - audio
          - voip
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).backgroundprompt
        EiginRelayURL: $(EIGIN_RELAY_URL)
        EiginRelayKey: $(EIGIN_RELAY_KEY)
        EiginSupportEmail: $(EIGIN_SUPPORT_EMAIL)
        NSUserActivityTypes:
          - INSendMessageIntent
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "0.13.0"
        CURRENT_PROJECT_VERSION: "12"
        INFOPLIST_KEY_CFBundleDisplayName: Eigin Dev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.dev
        KEYCHAIN_SERVICE_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        INFOPLIST_KEY_KEYCHAIN_SERVICE_NAME: $(KEYCHAIN_SERVICE_NAME)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Eigin uses the microphone to transcribe your voice into text messages."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Eigin uses on-device speech recognition to convert your voice into text."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Eigin uses your location to provide context-aware responses."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Eigin accesses your calendar to check your schedule and create events for you."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Eigin accesses your reminders to check and create reminders for you."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Eigin reads your health data to provide insights into your nutrition and activity."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Eigin saves nutritional data to Apple Health when you log meals."
        EIGIN_RELAY_URL: ${EIGIN_RELAY_URL_STAGING}
        EIGIN_RELAY_KEY: ${EIGIN_RELAY_KEY_STAGING}
        EIGIN_SUPPORT_EMAIL: ${EIGIN_SUPPORT_EMAIL}
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Eigin-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Sources/Eigin.entitlements
