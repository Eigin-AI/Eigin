name: Eigin-iOS
options:
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "17"

packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: "0.7.3"
  iosMath:
    url: https://github.com/junyan72/iosMath
    revision: "ba9ab7729b151329c54fd895a7c1859981d9484c"
  HighlightSwift:
    url: https://github.com/appstefan/highlightswift
    revision: "99c431b38a1444a5fd6a4978307fbbefe3a7af53"
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    exactVersion: "0.11.0"
  FluidAudio:
    url: https://github.com/42futures/FluidAudio.git
    branch: feature/pocket-tts-sessions
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"
  Factory:
    url: https://github.com/hmlongco/Factory
    from: "2.4.0"
  # Pinned by commit (the 1.8.0 tag), not `exactVersion` — SwiftMail 1.8.0
  # itself depends on swift-nio-imap by revision (no tagged release yet
  # contains a fix it needs), and SwiftPM refuses to resolve a version-pinned
  # package that transitively depends on a revision-pinned one.
  SwiftMail:
    url: https://github.com/Cocoanetics/SwiftMail
    revision: "dbb1d0bb6bc7742249cf4800513c5562d54fa734"
  LiteRTLM:
    path: Packages/LiteRTLM
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.13.0"

schemes:
  Eigin:
    build:
      targets:
        Eigin: all
        EiginWidgetsExtension: all
        EiginWatch: all
        EiginWatchWidgets: all
        EiginTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EiginTests

  EiginDev:
    build:
      targets:
        EiginDev: all
        EiginWidgetsDevExtension: all
        EiginWatchDev: all
        EiginWatchWidgetsDev: all
        EiginTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EiginTests
  # Test scheme for automated App Store screenshots — snapshot builds the dev
  # app and drives it through EiginUITests (see fastlane/Snapfile).
  EiginScreenshots:
    build:
      targets:
        EiginDev: all
        EiginUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EiginUITests

  EiginWidgetsExtension:
    build:
      targets:
        EiginWidgetsExtension: all
    run:
      config: Debug

  EiginWidgetsDevExtension:
    build:
      targets:
        EiginWidgetsDevExtension: all
    run:
      config: Debug

  # Watch-only runs, for building the companion against the watch simulator
  # without the phone app.
  EiginWatch:
    build:
      targets:
        EiginWatch: all
    run:
      config: Debug

  EiginWatchDev:
    build:
      targets:
        EiginWatchDev: all
    run:
      config: Debug

targets:
  Eigin:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info*.plist"
          # Screenshot automation is dev-only, never shipped: the whole debug
          # folder, plus the bridge the installer stages through.
          - "App/Debug/Screenshots/**"
          - "App/ScreenshotMode.swift"
      - Resources
    dependencies:
      - package: swift-markdown
        product: Markdown
      - package: SwiftSoup
      - package: iosMath
        product: iosMath
      - package: HighlightSwift
        product: HighlightSwift
      - package: MCP
      - package: FluidAudio
      - package: swift-transformers
        product: Tokenizers
      - package: Factory
      - package: LiteRTLM
      - package: SwiftMail
      - framework: Frameworks/FirmFFI.xcframework
        embed: false
      - target: EiginWidgetsExtension
        embed: true
        codeSign: true
        copiesFiles:
          - destination: plugins
      - target: EiginWatch
        embed: true
        codeSign: true
        copiesFiles:
          - destination: productsDirectory
            subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    postbuildScripts:
      - name: Generate dSYM for CLiteRTLM
        basedOnDependencyAnalysis: false
        path: scripts/generate_clitertlm_dsym.sh
    info:
      path: Sources/Info.plist
      properties:
        UIBackgroundModes:
          - audio
          - voip
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).backgroundprompt
        EiginRelayURL: $(EIGIN_RELAY_URL)
        EiginRelayKey: $(EIGIN_RELAY_PRIMARY_KEY)
        EiginSupportEmail: $(EIGIN_SUPPORT_EMAIL)
        EiginGoogleOAuthClientID: $(EIGIN_GOOGLE_OAUTH_CLIENT_ID)
        EiginMicrosoftOAuthClientID: $(EIGIN_MICROSOFT_OAUTH_CLIENT_ID)
        EiginAulaOAuthClientID: $(EIGIN_AULA_OAUTH_CLIENT_ID)
        EiginWatermarkSignature: $(EIGIN_WATERMARK_SIGNATURE)
        NSUserActivityTypes:
          - INSendMessageIntent
        CFBundleURLTypes:
          - CFBundleURLName: ai.eigin.app
            CFBundleURLSchemes: [eigin, ai.eigin]
        EiginPrivacyURL: $(EIGIN_PRIVACY_URL)
        EiginTermsURL: $(EIGIN_TERMS_URL)
        ITSAppUsesNonExemptEncryption: false
        # Credit packs are consumables, finished right after redeem. Without this key,
        # Transaction.all excludes finished consumables and reinstall recovery (#216) has
        # nothing to re-redeem.
        SKIncludeConsumableInAppPurchaseHistory: true
        # Mirrors the first onboarding frame: the mark centered on the app
        # background. Assets are generated from tokens by `eigin-tools generate`.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
    settings:
      configs:
        Release:
          ENABLE_PREVIEWS: NO
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "1.0.0"
        INFOPLIST_KEY_CFBundleDisplayName: Eigin
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Eigin uses the microphone to transcribe your voice into text messages."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Eigin uses on-device speech recognition to convert your voice into text."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Eigin uses your location when you ask about local time, weather, or places nearby."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Eigin accesses your calendar to check your schedule and create events for you."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Eigin accesses your reminders to check and create reminders for you."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Eigin reads your health data to give you insight into your nutrition, activity, sleep, and vitals."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Eigin saves data to Apple Health when you log meals, body measurements, or sleep."
        INFOPLIST_KEY_NSCameraUsageDescription: "Eigin uses the camera so you can take a photo and include it in your message."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Eigin accesses your photo library so you can attach images to your messages."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Eigin connects to mail servers, which may be on your local network, to send and receive email."
        EIGIN_RELAY_URL: ${EIGIN_RELAY_URL_PRODUCTION}
        EIGIN_RELAY_PRIMARY_KEY: ${EIGIN_RELAY_PRIMARY_KEY_PRODUCTION}
        EIGIN_SUPPORT_EMAIL: ${EIGIN_SUPPORT_EMAIL}
        EIGIN_PRIVACY_URL: ${EIGIN_PRIVACY_URL}
        EIGIN_TERMS_URL: ${EIGIN_TERMS_URL}
        EIGIN_WATERMARK_SIGNATURE: ${EIGIN_WATERMARK_SIGNATURE}
        EIGIN_GOOGLE_OAUTH_CLIENT_ID: ${EIGIN_GOOGLE_OAUTH_CLIENT_ID_PRODUCTION}
        EIGIN_MICROSOFT_OAUTH_CLIENT_ID: ${EIGIN_MICROSOFT_OAUTH_CLIENT_ID_PRODUCTION}
        EIGIN_AULA_OAUTH_CLIENT_ID: ${EIGIN_AULA_OAUTH_CLIENT_ID_PRODUCTION}
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Eigin-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Sources/Eigin.entitlements

  EiginTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    # Folder references keep the on-disk layout inside the test bundle.
    resources:
      - path: Tests/Core/Utilities/Fixtures
        type: folder
    dependencies:
      - target: Eigin
      - package: SwiftSoup
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.tests

  EiginUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - EiginUITests
    dependencies:
      - target: EiginDev
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.uitests
        TEST_TARGET_NAME: EiginDev

  EiginWidgetsExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Sources/AppIntents
      - path: Sources/Localizable.xcstrings
      # The design tokens, shared verbatim with the app, plus the hand-written
      # types they resolve against. Extensions compile their own copy; there is
      # no module boundary to import across.
      - Sources/Core/Design/Generated
      - Resources/Assets.xcassets
      - Resources/Fonts
      # App extensions also bundle the manifest: they compile files that touch UserDefaults.
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Core/Design/Theme.swift
      - path: Sources/Core/Design/TypographyStyle.swift
      - path: Sources/Core/Design/LineBox.swift
      - path: Sources/Core/Localized.swift
      - path: Sources/Core/Foundation/AppLanguage.swift
      - path: Sources/Core/Foundation/LanguageManager.swift
      - path: Sources/Core/Foundation/StorageKey.swift
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.widgets
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        INFOPLIST_KEY_CFBundleDisplayName: Eigin Widgets
        SKIP_INSTALL: true

  EiginWidgetsDevExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Sources/AppIntents
      - path: Sources/Localizable.xcstrings
      # The design tokens, shared verbatim with the app, plus the hand-written
      # types they resolve against. Extensions compile their own copy; there is
      # no module boundary to import across.
      - Sources/Core/Design/Generated
      - Resources/Assets.xcassets
      - Resources/Fonts
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Sources/Core/Design/Theme.swift
      - path: Sources/Core/Design/TypographyStyle.swift
      - path: Sources/Core/Design/LineBox.swift
      - path: Sources/Core/Localized.swift
      - path: Sources/Core/Foundation/AppLanguage.swift
      - path: Sources/Core/Foundation/LanguageManager.swift
      - path: Sources/Core/Foundation/StorageKey.swift
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.dev.widgets
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        INFOPLIST_KEY_CFBundleDisplayName: Eigin Widgets
        SKIP_INSTALL: true

  EiginDev:
    type: application
    platform: iOS
    sources:
      - path: Sources
        # Two plists live in Sources (app + dev app); each target's own is set
        # via info.path, so neither may be copied into the bundle as a resource.
        excludes:
          - "Info*.plist"
      # Screenshot automation: the launch stub compiles into this target only.
      - path: Sources/App/Debug/Screenshots
      # Test doubles reused for screenshot scenes (also compiled into EiginTests).
      - Resources
    dependencies:
      - package: swift-markdown
        product: Markdown
      - package: SwiftSoup
      - package: iosMath
        product: iosMath
      - package: HighlightSwift
        product: HighlightSwift
      - package: MCP
      - package: FluidAudio
      - package: swift-transformers
        product: Tokenizers
      - package: Factory
      - package: LiteRTLM
      - package: SwiftMail
      - framework: Frameworks/FirmFFI.xcframework
        embed: false
      - target: EiginWidgetsDevExtension
        embed: true
        codeSign: true
        copiesFiles:
          - destination: plugins
      - target: EiginWatchDev
        embed: true
        codeSign: true
        copiesFiles:
          - destination: productsDirectory
            subpath: "$(CONTENTS_FOLDER_PATH)/Watch"
    postbuildScripts:
      - name: Generate dSYM for CLiteRTLM
        basedOnDependencyAnalysis: false
        path: scripts/generate_clitertlm_dsym.sh
    info:
      path: Sources/Info-Dev.plist
      properties:
        UIBackgroundModes:
          - audio
          - voip
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).backgroundprompt
        EiginRelayURL: $(EIGIN_RELAY_URL)
        EiginRelayKey: $(EIGIN_RELAY_PRIMARY_KEY)
        EiginSupportEmail: $(EIGIN_SUPPORT_EMAIL)
        EiginGoogleOAuthClientID: $(EIGIN_GOOGLE_OAUTH_CLIENT_ID)
        EiginMicrosoftOAuthClientID: $(EIGIN_MICROSOFT_OAUTH_CLIENT_ID)
        EiginAulaOAuthClientID: $(EIGIN_AULA_OAUTH_CLIENT_ID)
        EiginWatermarkSignature: $(EIGIN_WATERMARK_SIGNATURE)
        NSUserActivityTypes:
          - INSendMessageIntent
        CFBundleURLTypes:
          - CFBundleURLName: ai.eigin.app.dev
            CFBundleURLSchemes: [eigin, eigindev, ai.eigin]
        EiginPrivacyURL: $(EIGIN_PRIVACY_URL)
        EiginTermsURL: $(EIGIN_TERMS_URL)
        ITSAppUsesNonExemptEncryption: false
        # Credit packs are consumables, finished right after redeem. Without this key,
        # Transaction.all excludes finished consumables and reinstall recovery (#216) has
        # nothing to re-redeem.
        SKIncludeConsumableInAppPurchaseHistory: true
        # Mirrors the first onboarding frame: the mark centered on the app
        # background. Assets are generated from tokens by `eigin-tools generate`.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
    settings:
      base:
        SWIFT_VERSION: "6.0"
        # Marks the dev target; the screenshot test doubles key on it (they are
        # also compiled into the app target, where `@testable import` is invalid).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EIGIN_DEV"
        GENERATE_INFOPLIST_FILE: true
        MARKETING_VERSION: "1.0.0"
        INFOPLIST_KEY_CFBundleDisplayName: Eigin Dev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.dev
        KEYCHAIN_SERVICE_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        INFOPLIST_KEY_KEYCHAIN_SERVICE_NAME: $(KEYCHAIN_SERVICE_NAME)
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Eigin uses the microphone to transcribe your voice into text messages."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Eigin uses on-device speech recognition to convert your voice into text."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Eigin uses your location when you ask about local time, weather, or places nearby."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Eigin accesses your calendar to check your schedule and create events for you."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Eigin accesses your reminders to check and create reminders for you."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Eigin reads your health data to give you insight into your nutrition, activity, sleep, and vitals."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Eigin saves data to Apple Health when you log meals, body measurements, or sleep."
        INFOPLIST_KEY_NSCameraUsageDescription: "Eigin uses the camera so you can take a photo and include it in your message."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Eigin accesses your photo library so you can attach images to your messages."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Eigin connects to mail servers, which may be on your local network, to send and receive email."
        EIGIN_RELAY_URL: ${EIGIN_RELAY_URL_STAGING}
        EIGIN_RELAY_PRIMARY_KEY: ${EIGIN_RELAY_PRIMARY_KEY_STAGING}
        EIGIN_SUPPORT_EMAIL: ${EIGIN_SUPPORT_EMAIL}
        EIGIN_PRIVACY_URL: ${EIGIN_PRIVACY_URL}
        EIGIN_TERMS_URL: ${EIGIN_TERMS_URL}
        EIGIN_WATERMARK_SIGNATURE: ${EIGIN_WATERMARK_SIGNATURE}
        EIGIN_GOOGLE_OAUTH_CLIENT_ID: ${EIGIN_GOOGLE_OAUTH_CLIENT_ID_STAGING}
        EIGIN_MICROSOFT_OAUTH_CLIENT_ID: ${EIGIN_MICROSOFT_OAUTH_CLIENT_ID_STAGING}
        EIGIN_AULA_OAUTH_CLIENT_ID: ${EIGIN_AULA_OAUTH_CLIENT_ID_STAGING}
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Eigin-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Sources/Eigin.entitlements

  # The watch companion (#245): push to talk, release to send; the answer
  # arrives by notification. Behavior mirrors the design gallery (Watch).
  EiginWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
        excludes:
          - "Info*.plist"
      # Shared wire vocabulary and the reply announcer contract, compiled
      # into both targets rather than shared through a module.
      - path: Sources/Watch/WatchMessage.swift
      - path: Sources/Watch/WatchReplyRouter.swift
      # The design tokens, shared verbatim with the app, plus the hand-written
      # types they resolve against. Extensions compile their own copy; there is
      # no module boundary to import across.
      - path: Sources/Core/Design/Generated
        excludes:
          # iOS-only (UINavigationBar); the watch registers its fonts directly.
          - "FontRegistration.swift"
      - path: Sources/Core/Design/Theme.swift
      - path: Sources/Core/Design/TypographyStyle.swift
      - path: Sources/Core/Design/LineBox.swift
      - path: Sources/Core/Localized.swift
      # The blob is the screen.
      - Sources/Core/Design/Components/MorphBlob
      - path: Sources/Core/Design/Animations.swift
      - Resources/Assets.xcassets
      - path: Sources/Core/Foundation/AppLanguage.swift
      - path: Sources/Core/Foundation/LanguageManager.swift
      - path: Sources/Core/Foundation/StorageKey.swift
      - path: Sources/Localizable.xcstrings
      # The generated WatchFonts decides which of the installed fonts to
      # register; this bundles the body face it lists.
      - path: Resources/Fonts/FiveSerifText-Regular.otf
        buildPhase: resources
    dependencies:
      - target: EiginWatchWidgets
        embed: true
        codeSign: true
        copiesFiles:
          - destination: plugins
    info:
      path: WatchApp/Info.plist
      properties:
        WKCompanionAppBundleIdentifier: ${BUNDLE_ID}
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        # The `.watchkitapp` suffix is required — the watch app will not pair
        # with its host under any other bundle id.
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.watchkitapp
        TARGETED_DEVICE_FAMILY: 4
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        INFOPLIST_KEY_CFBundleDisplayName: Eigin
        INFOPLIST_KEY_WKApplication: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Eigin uses the microphone so you can ask a question from your wrist."
        SKIP_INSTALL: true

  EiginWatchDev:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
        excludes:
          - "Info*.plist"
      - path: Sources/Watch/WatchMessage.swift
      - path: Sources/Watch/WatchReplyRouter.swift
      - path: Sources/Core/Design/Generated
        excludes:
          - "FontRegistration.swift"
      - path: Sources/Core/Design/Theme.swift
      - path: Sources/Core/Design/TypographyStyle.swift
      - path: Sources/Core/Design/LineBox.swift
      - path: Sources/Core/Localized.swift
      - Sources/Core/Design/Components/MorphBlob
      - path: Sources/Core/Design/Animations.swift
      - Resources/Assets.xcassets
      - path: Sources/Core/Foundation/AppLanguage.swift
      - path: Sources/Core/Foundation/LanguageManager.swift
      - path: Sources/Core/Foundation/StorageKey.swift
      - path: Sources/Localizable.xcstrings
      - path: Resources/Fonts/FiveSerifText-Regular.otf
        buildPhase: resources
    dependencies:
      - target: EiginWatchWidgetsDev
        embed: true
        codeSign: true
        copiesFiles:
          - destination: plugins
    info:
      path: WatchApp/Info-Dev.plist
      properties:
        WKCompanionAppBundleIdentifier: ${BUNDLE_ID}.dev
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.dev.watchkitapp
        TARGETED_DEVICE_FAMILY: 4
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        INFOPLIST_KEY_CFBundleDisplayName: Eigin Dev
        INFOPLIST_KEY_WKApplication: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Eigin uses the microphone so you can ask a question from your wrist."
        SKIP_INSTALL: true

  EiginWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
        excludes:
          - "Info*.plist"
      # Localized complication labels.
      - path: Sources/Core/Localized.swift
      - path: Sources/Localizable.xcstrings
      - path: Sources/Core/Foundation/AppLanguage.swift
      - path: Sources/Core/Foundation/LanguageManager.swift
      - path: Sources/Core/Foundation/StorageKey.swift
      # The brand mark the complication renders.
      - path: WatchWidgets/ComplicationAssets.xcassets
    info:
      path: WatchWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: 4
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        INFOPLIST_KEY_CFBundleDisplayName: Ask Eigin
        SKIP_INSTALL: true

  EiginWatchWidgetsDev:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
        excludes:
          - "Info*.plist"
      - path: Sources/Core/Localized.swift
      - path: Sources/Localizable.xcstrings
      - path: Sources/Core/Foundation/AppLanguage.swift
      - path: Sources/Core/Foundation/LanguageManager.swift
      - path: Sources/Core/Foundation/StorageKey.swift
      # The brand mark the complication renders.
      - path: WatchWidgets/ComplicationAssets.xcassets
    info:
      path: WatchWidgets/Info-Dev.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
