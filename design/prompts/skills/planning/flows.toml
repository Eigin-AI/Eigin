# Flow definitions for the planning skill.
#
# Each flow is an ordered list of stages. A stage's `instructions` path is
# relative to this file and points at a stage's `.jinja` prose. `show_notes`
# controls whether the accumulated notes recorded via advance_flow are
# rendered back to the model alongside that stage's instructions.
#
# Flow names must be globally unique across all skills. Each flow's stage
# prose lives under `flow/<flow_name>/`.

[[flows]]
name = "trip"

  [[flows.stages]]
  name = "preferences"
  instructions = "flow/trip/preferences.jinja"
  show_notes = false

  [[flows.stages]]
  name = "constraints"
  instructions = "flow/trip/constraints.jinja"
  show_notes = false

  [[flows.stages]]
  name = "options"
  instructions = "flow/trip/options.jinja"
  show_notes = false

  [[flows.stages]]
  name = "logistics"
  instructions = "flow/trip/logistics.jinja"
  show_notes = false

  [[flows.stages]]
  name = "itinerary"
  instructions = "flow/trip/itinerary.jinja"
  show_notes = true

