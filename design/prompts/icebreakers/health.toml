# Icebreakers for the "Health" use case, shown on an empty chat.
id = "health"
label.en = "Health"
label.da = "Sundhed"
order = 25

[[icebreaker]]
id = "log_meal"
title.en = "Log what I ate"
title.da = "Log, hvad jeg har spist"
prompt.en = "I want to log what I've eaten today. Ask me what I had, then save it to Apple Health."
prompt.da = "Jeg vil gerne logge, hvad jeg har spist i dag. Spørg, hvad jeg har fået, og gem det så i Apple Health."

[[icebreaker]]
id = "sleep_check"
title.en = "See how I've been sleeping"
title.da = "Se, hvordan jeg har sovet"
prompt.en = "Show me how I've been sleeping lately. Look at the last week and tell me what stands out."
prompt.da = "Vis mig, hvordan jeg har sovet på det seneste. Kig på den seneste uge, og fortæl, hvad der springer i øjnene."

[[icebreaker]]
id = "day_check_in"
title.en = "Check in on my day"
title.da = "Følg op på min dag"
prompt.en = "Check in on how my day is going — what I've eaten, how I've moved, how I slept. Tell me what you notice."
prompt.da = "Følg op på, hvordan min dag går — hvad jeg har spist, hvordan jeg har bevæget mig, og hvordan jeg har sovet. Fortæl, hvad du lægger mærke til."

[[icebreaker]]
id = "log_weight"
title.en = "Log my weight"
title.da = "Log min vægt"
prompt.en = "I want to log my weight. Ask me what it is, then save it to Apple Health and tell me how it compares to recent entries."
prompt.da = "Jeg vil gerne logge min vægt. Spørg mig, hvad den er, gem den så i Apple Health, og fortæl, hvordan den ser ud i forhold til de seneste målinger."
