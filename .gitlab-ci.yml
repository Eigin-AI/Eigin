variables:
  MDBOOK_VERSION: "0.5.3"
  MDBOOK_MERMAID_VERSION: "0.17.0"

docs:
  image: rust:1-bookworm
  tags:
    - shared
  environment: docs
  script:
    - apt-get update -qq && apt-get install -y -qq curl unzip jq
    - curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
    - unzip -q /tmp/awscliv2.zip -d /tmp/ && /tmp/aws/install -b /usr/local/bin
    - curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
    - curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
    - export PATH="$PWD:$PATH"
    - bash .gitlab/scripts/download-docs-fonts.sh
    - cargo run --locked --manifest-path tools/Cargo.toml -- generate docs
    - ./mdbook build docs/
    - aws s3 sync docs/book/ s3://eigin-docs/ --endpoint-url https://s3.fr-par.scw.cloud --delete
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

cla:
  image: alpine:3.20
  tags:
    - shared
  script:
    - apk add --no-cache curl jq
    - sh .gitlab/scripts/check-cla.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_PATH == "dev/eigin"

versions:
  image: rust:1-bookworm
  tags:
    - shared
  script:
    - apt-get update -qq && apt-get install -y -qq nodejs npm
    - cargo run --locked --manifest-path tools/Cargo.toml -- version check
    - cargo test --locked --manifest-path tools/Cargo.toml --test version
    - cargo install just --locked
    - cargo test --locked --manifest-path tools/Cargo.toml --test releases
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
