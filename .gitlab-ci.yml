variables:
  MDBOOK_VERSION: "0.4.43"
  MDBOOK_MERMAID_VERSION: "0.13.0"

docs:
  image: ubuntu:24.04
  tags:
    - shared
  environment: docs
  script:
    - apt-get update -qq && apt-get install -y -qq curl unzip
    - curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
    - unzip -q /tmp/awscliv2.zip -d /tmp/ && /tmp/aws/install -b /usr/local/bin
    - curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
    - curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
    - export PATH="$PWD:$PATH"
    - ./mdbook build docs/
    - aws s3 sync docs/book/ s3://eigin-docs/ --endpoint-url https://s3.fr-par.scw.cloud --delete
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

cla:
  image: alpine:3.20
  tags:
    - shared
  script:
    - apk add --no-cache curl jq
    - sh .gitlab/scripts/check-cla.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_PATH == "dev/eigin"
